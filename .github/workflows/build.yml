name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify project structure
        run: python3 scripts/verify.py

  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.4.0

      # gradlew, gradlew.bat, dan gradle-wrapper.jar adalah file resmi dari
      # repository Gradle pada tag v9.6.0 (bukan file buatan sendiri).
      # `chmod` diperlukan bila eksekusi bit hilang saat checkout.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect test report
        if: always()
        run: |
          mkdir -p build-reports
          find app/build/test-results -name "*.xml" -exec cp {} build-reports/ \; 2>/dev/null || true
          find app/build/reports -type f -exec cp {} build-reports/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-reports
          path: build-reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: luread-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
